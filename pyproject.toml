[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-image-gate"
version = "0.1.0"
description = "Typed preflight for image generation: Jev decides whether a prompt may spend and which Gemini tier to use; code calls the image API only after that decision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "typesafe-sdk>=0.5.7",
    "python-dotenv>=1.0.1",
    "google-genai>=1.73.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
jev-image-gate = "image_gen_controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_gen_controller = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
